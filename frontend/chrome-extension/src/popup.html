<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="styles/output.css" rel="stylesheet">

  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .animate-fadeIn {
      animation: fadeIn 0.4s ease;
    }
  </style>
</head>

<body class="m-0 bg-white font-sans w-[340px]">

<!-- ================= LOADER ================= -->
<div id="loader" class="h-[400px] flex flex-col items-center justify-center bg-[#0b1a3a] text-white">

  <!-- ✅ SIMPLE LOGO (NO CANVAS) -->
  <img id="logo"
     src="logo.png"
     class="w-20 h-20 object-contain transition-transform duration-200 ease-in-out" />
  <p class="mt-5 text-sm">Initializing NeuroAccess...</p>

</div>

<!-- ================= MAIN UI ================= -->
<div id="mainUI" class="hidden animate-fadeIn">

<div class="w-[340px] p-4 rounded-[20px] bg-[#f8fbff] shadow-[0_20px_40px_rgba(0,0,0,0.08)]">

  <!-- HEADER -->
  <div class="flex gap-[10px] items-center">
    <div class="bg-[#e0ecff] p-2 rounded-full flex items-center justify-center">
      <img src="logo.png" class="w-6 h-6 object-contain" />
    </div>
    <div>
      <h2 class="m-0 text-[16px] text-[#1e3a8a] font-semibold">NeuroAccess</h2>
      <p class="m-0 text-[12px] text-[#6b85a6]">Accessibility Assistant</p>
    </div>
  </div>

  <hr class="border-0 border-t border-[#e5efff] my-3">

  <!-- SCORE BOX -->
  <div class="flex gap-[14px] bg-[#eef4ff] p-[14px] rounded-[16px] items-center">

    <div class="w-[70px] h-[70px] rounded-full border-[6px] border-[#3b82f6] flex flex-col items-center justify-center font-bold text-[#1e3a8a]">
      <span id="scoreValue" class="text-[18px]">--</span>
      <small class="text-[10px]">/100</small>
    </div>

    <div>
      <h4 class="m-0 text-[13px] font-semibold">Accessibility Score</h4>
      <p class="my-[4px] text-[12px]">• <span id="altCount">--</span> Missing alt text</p>
      <p class="my-[4px] text-[12px]">• <span id="contrastCount">--</span> Low contrast areas</p>
      <p class="my-[4px] text-[12px]">• <span id="navCount">--</span> Navigation issues</p>
    </div>

  </div>

  <!-- FEATURES -->
  <div class="mt-3">
    <h3 class="my-[6px] text-[13px] text-[#1e3a8a] font-semibold">Features</h3>

    <label class="flex items-center gap-2 p-2 border-b border-[#e5efff] text-[13px]">
      <input type="checkbox" id="naContrastToggle" class="accent-[#2563eb]">
      Smart Contrast Fix
    </label>

    <label class="flex items-center gap-2 p-2 border-b border-[#e5efff] text-[13px]">
      <input type="checkbox" id="naKeyboardToggle" class="accent-[#2563eb]">
      Keyboard Navigation
    </label>

    <label class="flex items-center gap-2 p-2 border-b border-[#e5efff] text-[13px]">
      <input type="checkbox" id="naDyslexiaToggle" class="accent-[#2563eb]">
      Dyslexia Font Mode
    </label>

    <label class="flex items-center gap-2 p-2 border-b border-[#e5efff] text-[13px]">
      <input type="checkbox" id="naTTSToggle" class="accent-[#2563eb]">
      Text-to-Speech
    </label>

    <label class="flex items-center gap-2 p-2 text-[13px]">
      <input type="checkbox" id="naImageToggle" class="accent-[#2563eb]">
      AI Image Descriptions
    </label>
  </div>

  <!-- LOG -->
  <div class="mt-3">
    <h3 class="my-[6px] text-[13px] text-[#1e3a8a] font-semibold">Live Fix Log</h3>

    <div class="bg-[#eaf2ff] p-[10px] rounded-[12px] text-[12px] na-log">
      <p>• Ready...</p>
    </div>
  </div>

  <!-- BUTTONS -->
  <button id="naApplyBtn"
    class="w-full mt-3 p-[10px] rounded-[12px] text-white text-[14px]
    bg-gradient-to-r from-[#3b82f6] to-[#2563eb] cursor-pointer">
    ✓ Apply Changes
  </button>

  <button id="naResetBtn"
    class="w-full mt-2 p-[9px] rounded-[12px] border border-[#2563eb]
    bg-white text-[#2563eb] cursor-pointer">
    Reset
  </button>

  <!-- EXTRA -->
  <div class="flex gap-2 mt-2">
    <button id="voiceBtn" class="flex-1 border rounded-[12px] py-2 text-[13px]">🎤 Voice Control</button>
    <button id="ttsBtn" class="flex-1 border rounded-[12px] py-2 text-[13px]">🔊 Read Page</button>
  </div>

  <div class="text-center text-[11px] text-[#6b85a6] mt-[10px]">
    🔒 Privacy-first • Runs locally
  </div>

</div>
</div>

<script src="popup.js"></script>

</body>
</html>
